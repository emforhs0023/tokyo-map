  { day: 'x', name: '🍜 쓰케멘야 야스베에 아카사카점 (츠케멘)', time: '아카사카 저녁', area: '아카사카', rec: 'Day 1 저녁 추천', lat: 35.6745, lng: 139.7378, desc: '아카사카 소재 유명 츠케멘 전문점. 후운지 대신 선택 가능.', gmap: 'Yasubee+Akasaka+Tsukemen' },
  { day: 'x', name: '🌌 롯폰기 힐즈 스카이덱', time: '여유시', area: '롯폰기', rec: 'Day 2 저녁 추천', lat: 35.6604, lng: 139.7292, desc: '〈날씨의 아이〉 옥상 신사 모티브. 야외 헬리포트 전망대.', gmap: 'Roppongi+Hills+Sky+Deck' },
  { day: 'x', name: '🗽 오다이바 자유의 여신상', time: '여유시', area: '오다이바', rec: '반나절 여유시 추천', lat: 35.6263, lng: 139.7748, desc: '〈날씨의 아이〉 야경 명소. 무지개 다리 뷰.', gmap: 'Odaiba+Statue+of+Liberty' },
  { day: 'x', name: '🚉 도쿄역 마루노우치 광장', time: '여유시', area: '마루노우치', rec: 'Day 3 이동 중 추천', lat: 35.6814, lng: 139.7660, desc: '〈스즈메의 문단속〉 등장. 도쿄역 캐릭터 스트리트(B1)도 있음!', gmap: 'Tokyo+Station+Marunouchi' },
  { day: 'x', name: '🌉 오차노미즈 히지리바시', time: '여유시', area: '오차노미즈', rec: '여유시 추천', lat: 35.6993, lng: 139.7672, desc: '〈스즈메의 문단속〉 차 타는 장면.', gmap: 'Hijiribashi+Ochanomizu' },
  { day: 'x', name: '🛍 나카노 브로드웨이', time: '굿즈', area: '나카노', rec: '굿즈 쇼핑 추천', lat: 35.7088, lng: 139.6660, desc: '만다라케 본점. 희귀 빈티지 애니 굿즈 천국.', gmap: 'Nakano+Broadway' },
  { day: 'x', name: '🎭 이케부쿠로 애니메이트 본점', time: '굿즈', area: '이케부쿠로', rec: '굿즈 쇼핑 추천', lat: 35.7290, lng: 139.7137, desc: '8층 통째 애니샵. 신간 굿즈는 여기.', gmap: 'Animate+Ikebukuro' },
  { day: 'x', name: '🎨 시모키타자와', time: '편집샵', area: '시모키타자와', rec: 'Day 1~2 오후 추천', lat: 35.6614, lng: 139.6680, desc: '도쿄의 홍대. 빈티지·인디 편집샵 천국.', gmap: 'Shimokitazawa' },
  { day: 'x', name: '📚 다이칸야마 츠타야 T-Site', time: '편집샵', area: '다이칸야마', rec: 'Day 2 오후 추천', lat: 35.6486, lng: 139.7012, desc: '책+카페+패션 한 곳에.', gmap: 'Daikanyama+Tsutaya' },
  { day: 'x', name: '🍜 로쿠린샤 도쿄역점 (츠케멘)', time: '식사', area: '도쿄역', rec: 'Day 3 추천', lat: 35.6814, lng: 139.7676, desc: '츠케멘 명가. 도쿄역 라멘 스트리트(B1).', gmap: 'Rokurinsha+Tokyo+Station' },
];

const map = L.map('map').setView([35.6850, 139.7400], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);
const dayColors = { '1': '#2563eb', '2': '#dc2626', '3': '#16a34a', 'x': '#6b7280' };
const dayLabels = { '1': 'Day 1 — 도착 + 신카이 성지', '2': 'Day 2 — 메인 풀코스', '3': 'Day 3 — 출국', 'x': '🎁 시간 남으면' };
const dayAreas = { '1': '신주쿠 · 요쓰야 · 아카사카', '2': '하라주쿠 · 요요기 · 시부야', '3': '아사쿠사 · 스카이트리 · 긴자 · 신바시 · 시오도메', 'x': '' };
const markers = {};

function makeIcon(day) {
  return L.divIcon({ className: 'custom-marker', html: `<div style="background:${dayColors[day]};width:28px;height:28px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:12px;">${day === 'x' ? '+' : day}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] });
}

places.forEach((p, i) => {
  const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${p.gmap}`;
  const marker = L.marker([p.lat, p.lng], { icon: makeIcon(p.day) }).addTo(map).bindPopup(`<div class="popup-title">${p.name}</div><div class="popup-time">${p.time}</div><div class="popup-desc">${p.desc}</div><a class="popup-link" href="${gmapUrl}" target="_blank">📍 구글맵에서 열기</a>`);
  markers[i] = { marker, day: p.day };
});

function renderList() {
  const container = document.getElementById('place-list');
  container.innerHTML = '';
  ['1', '2', '3', 'x'].forEach(d => {
    const filtered = places.map((p, i) => ({ ...p, idx: i })).filter(p => p.day === d);
    if (!filtered.length) return;
    const section = document.createElement('div');
    section.className = `day-section d${d}`;
    const areaHtml = dayAreas[d] ? `<div class='day-area'>${dayAreas[d]}</div>` : '';
    section.innerHTML = `<h2>${dayLabels[d]}</h2>${areaHtml}`;
    filtered.forEach(p => {
      const gmapUrl = `https://www.google.com/maps/search/?api=1&query=${p.gmap}`;
      const item = document.createElement('div');
      item.className = 'place-item';
      const metaHtml = (p.area || p.rec) ? `<div class="place-meta">${p.area ? `<span class="place-area">📍 ${p.area}</span>` : ''}${p.rec ? `<span class="place-rec">${p.rec}</span>` : ''}</div>` : '';
      item.innerHTML = `<div class="place-name">${p.name}</div><div class="place-time">${p.time}</div>${metaHtml}<div class="place-desc">${p.desc}</div><a class="gmap-link" href="${gmapUrl}" target="_blank" onclick="event.stopPropagation()">📍 구글맵에서 열기 →</a>`;
      item.addEventListener('click', () => { map.flyTo([p.lat, p.lng], 16, { duration: 0.8 }); markers[p.idx].marker.openPopup(); });
      section.appendChild(item);
    });
    container.appendChild(section);
  });
}
renderList();

/* 탭 정의 — embed 차단 영상은 type:'yt-link' (새 탭 열기) */
const TABS = [
  { type: 'local',   src: 'narita-skyliner.mp4' },
  { type: 'yt-link', url: 'https://www.youtube.com/watch?v=M5m0e3yyMgM&t=63s',  label: '스카이라이너 타는 법 (1:03~)' },
  { type: 'yt',      videoId: 'kM8EkgM07jQ', start: 0, url: 'https://www.youtube.com/watch?v=kM8EkgM07jQ', label: '지하철 티켓 뽑는 법' },
  { type: 'yt-link', url: 'https://www.youtube.com/watch?v=M5m0e3yyMgM&t=158s', label: '교통카드/패스 정보 (2:38~)' },
];

let currentTab = -1;

function openModal() {
  document.getElementById('videoModal').classList.add('open');
}

function closeModal() {
  document.getElementById('videoModal').classList.remove('open');
  stopPlayer();
  currentTab = -1;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('modalPlayer').innerHTML = '<div class="empty-state">위 버튼을 눌러 영상을 선택하세요</div>';
}

function stopPlayer() {
  const player = document.getElementById('modalPlayer');
  const video = player.querySelector('video');
  if (video) video.pause();
  player.innerHTML = '';
}

function selectTab(idx) {
  if (currentTab === idx) return;
  currentTab = idx;
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  const tab = TABS[idx];
  const player = document.getElementById('modalPlayer');
  stopPlayer();

  if (tab.type === 'local') {
    player.innerHTML = `<video id="skyVideo" controls style="width:100%;display:block;max-height:60vh;"><source src="${tab.src}" type="video/mp4"></video>`;
  } else if (tab.type === 'yt-link') {
    /* embed 차단 영상 — 새 탭 버튼으로 안내 */
    player.innerHTML = `
      <div class="yt-placeholder">
        <p>이 영상은 외부 재생이 차단되어 있어요.<br>아래 버튼으로 유튜브에서 바로 열립니다.</p>
        <a class="yt-open-btn" href="${tab.url}" target="_blank">▶ ${tab.label} — 유튜브에서 열기</a>
      </div>`;
  } else {
    /* 일반 embed 가능 영상 */
    const isFileProtocol = location.protocol === 'file:';
    if (isFileProtocol) {
      player.innerHTML = `
        <div class="yt-placeholder">
          <p>🔒 로컬 파일로 열었을 때는 모달 안에서 재생할 수 없어요.<br>아래 버튼으로 유튜브에서 바로 열 수 있어요.</p>
          <a class="yt-open-btn" href="${tab.url}" target="_blank">▶ ${tab.label} — 유튜브에서 열기</a>
        </div>`;
    } else {
      const src = `https://www.youtube.com/embed/${tab.videoId}?autoplay=1${tab.start > 0 ? '&start=' + tab.start : ''}`;
      player.innerHTML = `<iframe src="${src}" style="width:100%;height:60vh;display:block;border:none;" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    }
  }
}

document.getElementById('videoModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

const activeDays = { '1': true, '2': true, '3': true, 'x': true };
document.querySelectorAll('.day-filter button').forEach(btn => {
  btn.addEventListener('click', () => {
    const d = btn.dataset.day;
    activeDays[d] = !activeDays[d];
    btn.classList.toggle('active');
    Object.values(markers).forEach(({ marker, day }) => { if (day === d) { if (activeDays[d]) marker.addTo(map); else map.removeLayer(marker); } });
  });
});
</script>
</body>
</html>
